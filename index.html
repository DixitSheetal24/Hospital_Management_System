<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hospital Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #f4f6f9;
    }
    .card-icon {
      font-size: 40px;
    }
    .nav-item{
      font-size: 20px;
      
    }
    .nav-item a{
      color: #f4f6f9;
    }
  </style>

  <script>
    if (localStorage.getItem("loggedIn") !== "true") {
    window.location.href = "login.html";
    }

   function logout() {
     localStorage.clear(); // clears ALL login data
     window.location.replace("login.html");
    
  }

  </script>

</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">
  
    <a class="navbar-brand fw-bold" href="#">🏥 Hospital Management System</a>

    <div class="collapse navbar-collapse">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="patients.html">Patients</a></li>
        <li class="nav-item"><a class="nav-link" href="doctors.html">Doctors</a></li>
        <li class="nav-item"><a class="nav-link" href="appointments.html">Appointments</a></li>
        <li class="nav-item"><a class="nav-link" href="doctor-appointments.html">DoctorInfo</a></li>

        <li class="nav-item">
         <a class="nav-link text-warning" href="#" onclick="logout()">Logout</a>

        </li>
      </ul>
    </div>
  
</nav>

<!-- 🔹 Dashboard -->
<div class="container mt-5">
  <h2 class="mb-4">Welcome 👋</h2>

  <div class="row g-4">

    <div class="col-md-4">
      <div class="card shadow text-center p-4">
        <div class="card-icon text-primary">👤</div>
        <h5 class="mt-3">Patients</h5>
        <p>Manage patient records</p>
        <a href="patients.html" class="btn btn-outline-primary">View</a>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card shadow text-center p-4">
        <div class="card-icon text-success">👨‍⚕️</div>
        <h5 class="mt-3">Doctors</h5>
        <p>Doctor details & specialties</p>
        <a href="doctors.html" class="btn btn-outline-success">View</a>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card shadow text-center p-4">
        <div class="card-icon text-danger">📅</div>
        <h5 class="mt-3">Appointments</h5>
        <p>Schedule & track appointments</p>
        <a href="appointments.html" class="btn btn-outline-danger">View</a>
      </div>
    </div>

  </div>
</div>

</body>
</html>
