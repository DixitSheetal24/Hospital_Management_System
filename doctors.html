<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Doctors</title>
  <link rel="stylesheet" href="style.css">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</head>

<body>

  <nav class="navbar">
    <h2 class="logo">Hospital Management</h2>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="patients.html">Patients</a></li>
      <li><a href="appointments.html">Appointments</a></li>
      
    </ul>
  </nav>

  <div class="container">

    <!-- Add Doctor -->
    <div class="card">
      <h3>Add Doctor</h3>
      <input id="name" class="form-control" placeholder="Doctor Name">
      <small class="text-danger" id="nameError"></small><br>

      <input id="email" class="form-control" placeholder="Email">
      <small class="text-danger" id="emailError"></small><br>

      <input id="specialization" class="form-control" placeholder="Specialization">
      <small class="text-danger" id="specializationError"></small><br>

      <input id="phone" class="form-control" placeholder="Phone">
      <small class="text-danger" id="phoneError"></small><br>

      <button onclick="addDoctor()">Add Doctor</button>
    </div>

    <nav>
      <ul class="pagination justify-content-center mt-3">
        <li class="page-item">
          <button class="page-link" onclick="prevPage()">Previous</button>
        </li>
        <li class="page-item">
          <button class="page-link" onclick="nextPage()">Next</button>
        </li>
      </ul>
    </nav>


    <!-- Doctors List -->
    <div class="card">
      <h3>Doctors List</h3>
      <table class="table table-bordered table-striped table-hover">
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Specialization</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="doctorsTable"></tbody>
      </table>
    </div>

  </div>

  <script src="doctors.js"></script>
</body>

</html>
