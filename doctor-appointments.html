<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Doctor Appointments</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

 
  
</head>
<body>
   <nav class="navbar">
  <a class="navbar-brand fw-bold" style="color: white;" href="#">🏥 Hospital Management System</a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="patients.html">Patients</a></li>
      <li><a href="doctors.html">Doctors</a></li>
      
    </ul>
  </nav>


  <div class="d_apt">
    <a class="navbar-brand fw-bold">🏥 Doctor Appointments</a>
  </div> 


<div class="container mt-4">

  <!-- Doctor Search -->
  <div class="card p-3 shadow-sm">
    <h5>Get Doctor By ID</h5>
    <div class="row g-2">
      <div class="col-md-4">
        <input type="number" id="doctorId" class="form-control" placeholder="Enter Doctor ID">
      </div>
      <div class="col-md-2">
        <button class="btn btn-primary w-100" onclick="getDoctorById()">Search</button>
      </div>
    </div>
    <p id="doctorError" class="text-danger mt-2"></p>
  </div>

  <!-- Doctor Info -->
  <div id="doctorInfo" class="card mt-4 p-3 shadow-sm d-none"></div>

  <!-- Appointments -->
  <div class="card mt-4 p-3 shadow-sm">
    <h5>Appointments</h5>
    <table class="table table-bordered table-hover mt-2">
      <thead class="table-light">
        <tr>
          <th>ID</th>
          <th>Patient</th>
          <th>Date & Time</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="appointmentsTable"></tbody>
    </table>
  </div>

</div>

<script src="doctor-appointments.js"></script>
</body>
</html>
